<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>td · Project workspace</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to tasks</a>
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#board"
        ><span class="brand-mark">td<span>_</span></span
        ><span class="brand-caption">PROJECT WORKSPACE</span></a
      >
      <div class="project">
        <span class="project-avatar" id="project-initial">·</span>
        <div>
          <strong id="project-name">Loading project…</strong
          ><span class="muted">Local workspace</span>
        </div>
      </div>
      <nav id="navigation" aria-label="Views"></nav>
      <div class="section-label">
        SAVED BOARDS
        <button
          class="icon-button"
          data-action="new-board"
          aria-label="Create board"
        >
          +
        </button>
      </div>
      <nav id="boards" aria-label="Saved boards"></nav>
      <div class="sidebar-bottom">
        <div id="connection" class="connection" role="status">
          <span class="connection-dot"></span>Connecting…
        </div>
        <div class="sidebar-tools">
          <button class="quiet" data-action="theme" id="theme-button">
            Theme: system</button
          ><button
            class="icon-button"
            data-action="shortcuts"
            aria-label="Keyboard shortcuts"
          >
            ?
          </button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">
          <span id="breadcrumb-project">Project</span><span>/</span
          ><strong id="breadcrumb-view">Board</strong>
        </div>
        <button class="primary" data-action="new-task">
          + New task <kbd>N</kbd>
        </button>
      </header>
      <div class="view-heading">
        <div>
          <div class="eyebrow">YOUR PROJECT, IN MOTION</div>
          <h1 id="view-title">Board</h1>
          <p id="view-description" class="muted">
            A clear view of what comes next.
          </p>
        </div>
        <div id="summary" class="summary"></div>
      </div>
      <form id="filters" class="toolbar" role="search">
        <label class="search-field"
          ><span aria-hidden="true">⌕</span
          ><input
            id="search"
            name="search"
            type="search"
            placeholder="Search tasks…"
            aria-label="Search tasks"
            autocomplete="off"
          /><kbd>/</kbd></label
        >
        <select id="search-mode" name="search_mode" aria-label="Search mode">
          <option value="text">Text</option>
          <option value="tdq">TDQ</option>
        </select>
        <select id="type-filter" name="type" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="task">Task</option>
          <option value="bug">Bug</option>
          <option value="feature">Feature</option>
          <option value="epic">Epic</option>
          <option value="chore">Chore</option>
        </select>
        <select
          id="priority-filter"
          name="priority"
          aria-label="Filter by priority"
        >
          <option value="">All priorities</option>
          <option>P0</option>
          <option>P1</option>
          <option>P2</option>
          <option>P3</option>
          <option>P4</option>
        </select>
        <label class="check-label"
          ><input id="include-closed" name="include_closed" type="checkbox" />
          Closed</label
        >
        <button type="submit" class="quiet">Apply</button
        ><button
          type="button"
          class="icon-button"
          data-action="refresh"
          aria-label="Refresh workspace"
        >
          ↻
        </button>
      </form>
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <section id="content" class="content" tabindex="-1" aria-label="Tasks">
        <div class="empty-state"><p>Loading your workspace…</p></div>
      </section>
      <footer class="workspace-footer">
        <span id="result-count"></span
        ><span>Local data. Live updates. <kbd>?</kbd> shortcuts</span>
      </footer>
    </main>
    <aside id="drawer" class="drawer" aria-label="Task details" hidden></aside>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript
      >This workspace needs JavaScript. You can also use td from your
      terminal.</noscript
    >
  </body>
</html>
