  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Panels, boards, modals and the theme seam that lets Sidecar restyle a running monitor. Actions go through the same policy and write path as the CLI.</tspan></text></g>
