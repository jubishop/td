      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">Monitor TUI</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M263,170.5 L475.3,170.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,170.5 L279,170.5 L279,355 L475.3,355" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,170.5 L279,170.5 L279,554.5 L487.55,554.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,170.5 L279,170.5 L279,773 L475.3,773" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,170.5 L279,170.5 L279,985 L475.3,985" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M701.55,554.5 L925.11,554.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="monitor.model"><rect x="50" y="89" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 106) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Model, Panels &amp;</tspan><tspan x="70" dy="20">Views</tspan></text>
      <text x="70" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">The Bubble Tea model:</tspan><tspan x="70" dy="17">current-work, task-list,</tspan><tspan x="70" dy="17">and activity panels, focus,</tspan><tspan x="70" dy="17">scrolling, search, and the</tspan><tspan x="70" dy="17">footer.</tspan></text>
      </g><g data-element="monitor.kanban"><rect x="476.29999999999995" y="284" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(662.3 301) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="496.3" y="316" font-size="14" font-weight="600" fill="#292927"><tspan x="496.3" dy="0">Boards &amp; Kanban</tspan></text>
      <text x="496.3" y="340" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="496.3" dy="0">Board view with swimlanes,</tspan><tspan x="496.3" dy="17">drag positions, and the</tspan><tspan x="496.3" dy="17">board editor. Board layout</tspan><tspan x="496.3" dy="17">state lives in the database,</tspan><tspan x="496.3" dy="17">not config.json.</tspan></text>
      </g><g data-element="monitor.modals"><rect x="476.29999999999995" y="89" width="236.49999999999994" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(686.8 106) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="496.3" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="496.3" dy="0">Declarative Modals &amp;</tspan><tspan x="496.3" dy="20">Forms</tspan></text>
      <text x="496.3" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="496.3" dy="0">Stacking modal system, issue</tspan><tspan x="496.3" dy="17">forms with autofill, notes</tspan><tspan x="496.3" dy="17">editor, help, and confirmations.</tspan><tspan x="496.3" dy="17">Renders through the injected</tspan><tspan x="496.3" dy="17">theme.</tspan></text>
      </g><g data-element="monitor.data"><rect x="488.54999999999995" y="458" width="212" height="193" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(674.55 475) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="508.55" y="490" font-size="14" font-weight="600" fill="#292927"><tspan x="508.55" dy="0">Refresh &amp; Actions</tspan></text>
      <text x="508.55" y="514" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="508.55" dy="0">Polls the store on an</tspan><tspan x="508.55" dy="17">interval, assembles task</tspan><tspan x="508.55" dy="17">list and activity data (also</tspan><tspan x="508.55" dy="17">reused by td serve), and</tspan><tspan x="508.55" dy="17">dispatches actions (start,</tspan><tspan x="508.55" dy="17">review, approve, delete)</tspan><tspan x="508.55" dy="17">through the same policy as</tspan><tspan x="508.55" dy="17">the CLI.</tspan></text>
      </g><g data-element="monitor.theme"><rect x="476.29999999999995" y="683" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(662.3 700) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="496.3" y="715" font-size="14" font-weight="600" fill="#292927"><tspan x="496.3" dy="0">Theme &amp; Embedding</tspan><tspan x="496.3" dy="20">Seam</tspan></text>
      <text x="496.3" y="760" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="496.3" dy="0">Host-neutral palette and</tspan><tspan x="496.3" dy="17">optional panel/modal</tspan><tspan x="496.3" dy="17">renderers so an embedder</tspan><tspan x="496.3" dy="17">(Sidecar) can restyle a</tspan><tspan x="496.3" dy="17">running monitor without</tspan><tspan x="496.3" dy="17">restarting it.</tspan></text>
      </g><g data-element="monitor.sync_runtime"><rect x="476.29999999999995" y="895" width="217.59999999999997" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(667.9 912) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="496.3" y="927" font-size="14" font-weight="600" fill="#292927"><tspan x="496.3" dy="0">Background Sync</tspan><tspan x="496.3" dy="20">Runtime</tspan></text>
      <text x="496.3" y="972" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="496.3" dy="0">Owns a tdsync Syncer for</tspan><tspan x="496.3" dy="17">the open project: starts the</tspan><tspan x="496.3" dy="17">live ladder, refreshes panels</tspan><tspan x="496.3" dy="17">when pulled data changes,</tspan><tspan x="496.3" dy="17">and forwards rung status to</tspan><tspan x="496.3" dy="17">an embedder callback.</tspan></text>
      </g><g data-element="monitor.dbpool"><rect x="926.1099999999999" y="483.5" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1112.11 500.5) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="946.11" y="515.5" font-size="14" font-weight="600" fill="#292927"><tspan x="946.11" dy="0">Shared DB Handle</tspan></text>
      <text x="946.11" y="539.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="946.11" dy="0">Singleton connection per</tspan><tspan x="946.11" dy="17">database path so</tspan><tspan x="946.11" dy="17">value-copied Bubble Tea</tspan><tspan x="946.11" dy="17">models do not leak SQLite</tspan><tspan x="946.11" dy="17">connections when embedded.</tspan></text>
      </g><g><rect x="311" y="176.5" width="116.29999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="369.15" y="189.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="369.15" dy="0">Open forms, notes,</tspan><tspan x="369.15" dy="15">help</tspan></text></g><g><rect x="333.44" y="361" width="71.42" height="23" rx="5" fill="#f8f8f6"/><text x="369.15" y="374" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="369.15" dy="0">Board view</tspan></text></g><g><rect x="316.005" y="560.5" width="106.28999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="369.15" y="573.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="369.15" dy="0">Refresh and</tspan><tspan x="369.15" dy="15">dispatch actions</tspan></text></g><g><rect x="311" y="779" width="116.29999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="369.15" y="792" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="369.15" dy="0">Resolve colors and</tspan><tspan x="369.15" dy="15">renderers</tspan></text></g><g><rect x="311.385" y="991" width="115.52999999999999" height="38" rx="5" fill="#f8f8f6"/><text x="369.15" y="1004" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="369.15" dy="0">Show sync status,</tspan><tspan x="369.15" dy="15">refresh on change</tspan></text></g><g><rect x="761.8" y="560.5" width="115.30999999999996" height="23" rx="5" fill="#f8f8f6"/><text x="819.4549999999999" y="573.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="819.4549999999999" dy="0">Shared connection</tspan></text></g></g>
