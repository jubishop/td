<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">td / Sync client: action_log becomes events</title><desc id="description">Gate, syncer, event engine, live ladder and the HTTP adapter, with the store rows and user credentials they depend on.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">td / Sync client: action_log becomes events</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Gate, syncer, event engine, live ladder and the HTTP adapter, with the store rows and user credentials they depend on.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(96 212.549) scale(1.104)"><g data-element="syncclient"><rect x="25" y="24" width="1515.27" height="634" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1514.27 41) scale(0.667)" color="#C48282" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">Sync Client</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M686,308.5 L702,308.5 L702,546 L885.76,546" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M686,308.5 L853.76,308.5 L853.76,179 L885.76,179" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M686,308.5 L702,308.5 L702,363.5 L885.76,363.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L279,179 L279,308.5 L472,308.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L885.76,179" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1099.76,546 L1302.27,546" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="syncclient.syncer"><rect x="473" y="212" width="212" height="193" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(659 229) scale(0.667)" color="#C48282" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="493" y="244" font-size="14" font-weight="600" fill="#292927"><tspan x="493" dy="0">Syncer &amp; Gate</tspan></text>
      <text x="493" y="268" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="493" dy="0">Steady-state policy:</tspan><tspan x="493" dy="17">decides whether sync is</tspan><tspan x="493" dy="17">open (kill switch, feature</tspan><tspan x="493" dy="17">flag, per-project</tspan><tspan x="493" dy="17">configured), runs one</tspan><tspan x="493" dy="17">push-and-pull round,</tspan><tspan x="493" dy="17">expires credentials on auth</tspan><tspan x="493" dy="17">failure.</tspan></text>
      </g><g data-element="syncclient.live"><rect x="50" y="108" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 125) scale(0.667)" color="#C48282" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="140" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Live Sync Ladder</tspan></text>
      <text x="70" y="164" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Long-lived loop: SSE stream</tspan><tspan x="70" dy="17">when the server allows it,</tspan><tspan x="70" dy="17">timed polling fallback</tspan><tspan x="70" dy="17">otherwise, RequestSync for</tspan><tspan x="70" dy="17">immediate rounds.</tspan></text>
      </g><g data-element="syncclient.engine"><rect x="886.76" y="458" width="212" height="176" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1072.76 475) scale(0.667)" color="#C48282" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="906.76" y="490" font-size="14" font-weight="600" fill="#292927"><tspan x="906.76" dy="0">Event Engine</tspan></text>
      <text x="906.76" y="514" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="906.76" dy="0">Reads pending action_log</tspan><tspan x="906.76" dy="17">rows as events (backfilling</tspan><tspan x="906.76" dy="17">creates), applies remote</tspan><tspan x="906.76" dy="17">events with conflict</tspan><tspan x="906.76" dy="17">detection, marks rows</tspan><tspan x="906.76" dy="17">synced, resolves pull</tspan><tspan x="906.76" dy="17">outcomes.</tspan></text>
      </g><g data-element="syncclient.taxonomy"><rect x="1303.27" y="458" width="212" height="176" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1489.27 475) scale(0.667)" color="#C48282" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1323.27" y="490" font-size="14" font-weight="600" fill="#292927"><tspan x="1323.27" dy="0">Event Taxonomy</tspan></text>
      <text x="1323.27" y="514" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1323.27" dy="0">Canonical entity and action</tspan><tspan x="1323.27" dy="17">types shared by client and</tspan><tspan x="1323.27" dy="17">server; normalizes legacy</tspan><tspan x="1323.27" dy="17">singular names and maps td</tspan><tspan x="1323.27" dy="17">action types onto</tspan><tspan x="1323.27" dy="17">create/update/delete/rest</tspan><tspan x="1323.27" dy="17">ore.</tspan></text>
      </g><g data-element="syncclient.http"><rect x="886.76" y="89" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1072.76 106) scale(0.667)" color="#C48282" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="906.76" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="906.76" dy="0">Server HTTP</tspan><tspan x="906.76" dy="20">Adapter</tspan></text>
      <text x="906.76" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="906.76" dy="0">Typed client for auth</tspan><tspan x="906.76" dy="17">(device flow with PKCE),</tspan><tspan x="906.76" dy="17">projects, members, push,</tspan><tspan x="906.76" dy="17">pull, snapshot, status and</tspan><tspan x="906.76" dy="17">the events stream.</tspan><tspan x="906.76" dy="17">Transport only; no policy.</tspan></text>
      </g><g data-element="syncclient.credentials"><rect x="886.76" y="301" width="212" height="125" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1072.76 318) scale(0.667)" color="#C48282" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="906.76" y="333" font-size="14" font-weight="600" fill="#292927"><tspan x="906.76" dy="0">User Sync Config</tspan></text>
      <text x="906.76" y="357" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="906.76" dy="0">~/.config/td/auth.json (API</tspan><tspan x="906.76" dy="17">key, device id, server URL)</tspan><tspan x="906.76" dy="17">and config.json (autosync</tspan><tspan x="906.76" dy="17">kill switch, interval).</tspan></text>
      </g><g><rect x="737.245" y="552" width="97.26999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="785.88" y="565" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="785.88" dy="0">Extract, apply,</tspan><tspan x="785.88" dy="15">mark synced</tspan></text></g><g><rect x="743.405" y="314.5" width="84.94999999999999" height="23" rx="5" fill="#f8f8f6"/><text x="785.88" y="327.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="785.88" dy="0">Push and pull</tspan></text></g><g><rect x="734" y="369.5" width="103.75999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="785.88" y="382.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="785.88" dy="0">Server URL, key,</tspan><tspan x="785.88" dy="15">device id</tspan></text></g><g><rect x="311" y="314.5" width="112.99999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="367.5" y="327.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="367.5" dy="0">Round on event or</tspan><tspan x="367.5" dy="15">timer</tspan></text></g><g><rect x="532.51" y="154" width="92.97999999999998" height="23" rx="5" fill="#f8f8f6"/><text x="579" y="167" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="579" dy="0">Events stream</tspan></text></g><g><rect x="1147.7599999999998" y="552" width="106.50999999999999" height="38" rx="5" fill="#f8f8f6"/><text x="1201.0149999999999" y="565" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1201.0149999999999" dy="0">Normalize entity</tspan><tspan x="1201.0149999999999" dy="15">and action types</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#ddddda"/><text x="96" y="1044" font-size="13" fill="#7d7d77">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#7d7d77">FOCUS: Sync Client · 14 external connections outside view</text></g></svg>
