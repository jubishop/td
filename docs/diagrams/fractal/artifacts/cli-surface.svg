<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">td / The agent&apos;s surface: the CLI</title><desc id="description">How a command flows from root dispatch through the command groups into the core and the store, and where hints, telemetry and the autosync hooks sit around it.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">td / The agent&apos;s surface: the CLI</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">How a command flows from root dispatch through the command groups into the core and the store, and where hints, telemetry and the autosync hooks sit around it.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(797.939 210) scale(0.418)"><g data-element="cli"><rect x="25" y="24" width="725.0299999999999" height="1764.5" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(724.03 41) scale(0.667)" color="#759EB5" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">td CLI</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M289.32,1479.5 L305.32,1479.5 L305.32,1261 L509.65,1261" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,1479.5 L509.65,1479.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,1479.5 L305.32,1479.5 L305.32,1683 L509.65,1683" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,622.5 L477.65,622.5 L477.65,395.5 L509.65,395.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,395.5 L509.65,395.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,807 L477.65,807 L477.65,395.5 L509.65,395.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M289.32,1214 L477.65,1214 L477.65,395.5 L509.65,395.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="cli.root"><rect x="76.31999999999994" y="1391.5" width="212" height="176" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(262.32 1408.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="96.32" y="1423.5" font-size="14" font-weight="600" fill="#292927"><tspan x="96.32" dy="0">Root &amp; Dispatch</tspan></text>
      <text x="96.32" y="1447.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="96.32" dy="0">Resolves the project root</tspan><tspan x="96.32" dy="17">(--work-dir, TD_WORK_DIR,</tspan><tspan x="96.32" dy="17">.td-root, associations),</tspan><tspan x="96.32" dy="17">runs the gated sync hooks</tspan><tspan x="96.32" dy="17">around every command, and</tspan><tspan x="96.32" dy="17">turns errors into a JSON</tspan><tspan x="96.32" dy="17">envelope or a human hint.</tspan></text>
      </g><g data-element="cli.issue_cmds"><rect x="76.31999999999994" y="543" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(262.32 560) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="96.32" y="575" font-size="14" font-weight="600" fill="#292927"><tspan x="96.32" dy="0">Issue Commands</tspan></text>
      <text x="96.32" y="599" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="96.32" dy="0">create, list, show, update,</tspan><tspan x="96.32" dy="17">log, handoff, note, comment,</tspan><tspan x="96.32" dy="17">due, defer, link. Read and</tspan><tspan x="96.32" dy="17">write issues through the</tspan><tspan x="96.32" dy="17">store facade and render via</tspan><tspan x="96.32" dy="17">the output layer.</tspan></text>
      </g><g data-element="cli.workflow_cmds"><rect x="76.31999999999994" y="280" width="212" height="231" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(262.32 297) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="96.32" y="312" font-size="14" font-weight="600" fill="#292927"><tspan x="96.32" dy="0">Workflow</tspan><tspan x="96.32" dy="20">Commands</tspan></text>
      <text x="96.32" y="357" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="96.32" dy="0">start, review, approve,</tspan><tspan x="96.32" dy="17">reject, close, block,</tspan><tspan x="96.32" dy="17">unblock, reopen. Each</tspan><tspan x="96.32" dy="17">transition is checked</tspan><tspan x="96.32" dy="17">against the shared</tspan><tspan x="96.32" dy="17">transition table; approve</tspan><tspan x="96.32" dy="17">and close eligibility comes</tspan><tspan x="96.32" dy="17">from the review policy</tspan><tspan x="96.32" dy="17">before anything is written.</tspan></text>
      </g><g data-element="cli.session_cmds"><rect x="50" y="1141" width="238.31999999999994" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(262.32 1158) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="1173" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Session &amp; Context</tspan><tspan x="70" dy="20">Commands</tspan></text>
      <text x="70" y="1218" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">usage, resume, session, ws (work</tspan><tspan x="70" dy="17">sessions), focus. Give a new</tspan><tspan x="70" dy="17">context window the durable</tspan><tspan x="70" dy="17">state it needs to continue.</tspan></text>
      </g><g data-element="cli.query_cmds"><rect x="50" y="734" width="238.31999999999994" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(262.32 751) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="766" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Query &amp; Reporting</tspan><tspan x="70" dy="20">Commands</tspan></text>
      <text x="70" y="811" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">query (TDQ), search, stats,</tspan><tspan x="70" dy="17">board, dependencies, epic.</tspan><tspan x="70" dy="17">Read-only projections over the</tspan><tspan x="70" dy="17">same store.</tspan></text>
      </g><g data-element="cli.sync_cmds"><rect x="63.15999999999997" y="912" width="212" height="197" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(249.16 929) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="83.16" y="944" font-size="14" font-weight="600" fill="#292927"><tspan x="83.16" dy="0">Auth &amp; Sync</tspan><tspan x="83.16" dy="20">Commands</tspan></text>
      <text x="83.16" y="989" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="83.16" dy="0">auth login/logout, sync</tspan><tspan x="83.16" dy="17">init/link/status/push/pull/</tspan><tspan x="83.16" dy="17">tail/enable/disable.</tspan><tspan x="83.16" dy="17">Registered behind the</tspan><tspan x="83.16" dy="17">sync_cli feature gate; sync</tspan><tspan x="83.16" dy="17">status stays available for</tspan><tspan x="83.16" dy="17">diagnostics.</tspan></text>
      </g><g data-element="cli.autosync_hooks"><rect x="510.64999999999986" y="1164.5" width="212" height="193" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(696.65 1181.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="530.65" y="1196.5" font-size="14" font-weight="600" fill="#292927"><tspan x="530.65" dy="0">Autosync Hooks</tspan></text>
      <text x="530.65" y="1220.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="530.65" dy="0">PersistentPreRun/PostRun</tspan><tspan x="530.65" dy="17">hooks. Run one</tspan><tspan x="530.65" dy="17">push-and-pull round on</tspan><tspan x="530.65" dy="17">startup (for commands not</tspan><tspan x="530.65" dy="17">on the skip list) and,</tspan><tspan x="530.65" dy="17">debounced, after any</tspan><tspan x="530.65" dy="17">mutating command, when the</tspan><tspan x="530.65" dy="17">per-project gate is open.</tspan></text>
      </g><g data-element="cli.system_cmds"><rect x="63.15999999999997" y="89" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(249.16 106) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="83.16" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="83.16" dy="0">System Commands</tspan></text>
      <text x="83.16" y="145" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="83.16" dy="0">init, doctor, undo, config,</tspan><tspan x="83.16" dy="17">export/import, upgrade,</tspan><tspan x="83.16" dy="17">version, serve, monitor.</tspan><tspan x="83.16" dy="17">Project bootstrap, repair,</tspan><tspan x="83.16" dy="17">and launching the other</tspan><tspan x="83.16" dy="17">surfaces.</tspan></text>
      </g><g data-element="cli.output"><rect x="510.64999999999986" y="324.5" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(696.65 341.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="530.65" y="356.5" font-size="14" font-weight="600" fill="#292927"><tspan x="530.65" dy="0">Output Rendering</tspan></text>
      <text x="530.65" y="380.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="530.65" dy="0">Human tables, markdown,</tspan><tspan x="530.65" dy="17">trees, and the --json</tspan><tspan x="530.65" dy="17">contract shared by every</tspan><tspan x="530.65" dy="17">command. JSON stdout stays</tspan><tspan x="530.65" dy="17">pure; hints go to stderr.</tspan></text>
      </g><g data-element="cli.suggest"><rect x="510.64999999999986" y="1389.5" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(696.65 1406.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="530.65" y="1421.5" font-size="14" font-weight="600" fill="#292927"><tspan x="530.65" dy="0">Hints &amp;</tspan><tspan x="530.65" dy="20">Suggestions</tspan></text>
      <text x="530.65" y="1466.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="530.65" dy="0">Did-you-mean and alias hints</tspan><tspan x="530.65" dy="17">for unknown flags, and</tspan><tspan x="530.65" dy="17">workflow hints for unknown</tspan><tspan x="530.65" dy="17">commands such as done or</tspan><tspan x="530.65" dy="17">finish. Reduces agent retry</tspan><tspan x="530.65" dy="17">loops.</tspan></text>
      </g><g data-element="cli.analytics"><rect x="510.64999999999986" y="1601.5" width="214.37999999999997" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(699.03 1618.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="530.65" y="1633.5" font-size="14" font-weight="600" fill="#292927"><tspan x="530.65" dy="0">Usage &amp; Error</tspan><tspan x="530.65" dy="20">Telemetry</tspan></text>
      <text x="530.65" y="1678.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="530.65" dy="0">Appends command usage and</tspan><tspan x="530.65" dy="17">failed invocations to local</tspan><tspan x="530.65" dy="17">JSONL files under .todos for</tspan><tspan x="530.65" dy="17">agent-DX analysis. Local</tspan><tspan x="530.65" dy="17">only; never synced.</tspan></text>
      </g><g><rect x="337.31999999999994" y="1267" width="124.32999999999996" height="23" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="1280" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Pre/post-run hooks</tspan></text></g><g><rect x="349.3649999999999" y="1485.5" width="100.24" height="38" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="1498.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Unknown flag or</tspan><tspan x="399.4849999999999" dy="15">command hints</tspan></text></g><g><rect x="341.7199999999999" y="1689" width="115.52999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="1702" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Command usage and</tspan><tspan x="399.4849999999999" dy="15">failures</tspan></text></g><g><rect x="351.2349999999999" y="628.5" width="96.49999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="641.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Render results</tspan></text></g><g><rect x="351.2349999999999" y="401.5" width="96.49999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="414.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Render results</tspan></text></g><g><rect x="351.2349999999999" y="813" width="96.49999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="826" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Render results</tspan></text></g><g><rect x="351.2349999999999" y="1220" width="96.49999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="399.4849999999999" y="1233" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="399.4849999999999" dy="0">Render results</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#ddddda"/><text x="96" y="1044" font-size="13" fill="#7d7d77">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#7d7d77">FOCUS: td CLI · 25 external connections outside view</text></g></svg>
