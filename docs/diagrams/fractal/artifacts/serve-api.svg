<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">td / td serve: the local HTTP boundary</title><desc id="description">Router, pure handlers, change stream and port-file discovery. The handlers are the same ones the sync server wraps for hosted projects.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">td / td serve: the local HTTP boundary</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Router, pure handlers, change stream and port-file discovery. The handlers are the same ones the sync server wraps for hosted projects.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(567.162 210) scale(1.005)"><g data-element="serve"><rect x="25" y="24" width="731.53" height="706" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(730.53 41) scale(0.667)" color="#B59669" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">td serve Local API</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M263,179 L279,179 L279,399.5 L474.53,399.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L279,179 L279,618 L474.53,618" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L474.53,179" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="serve.router"><rect x="50" y="97.5" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 114.5) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="129.5" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Router &amp;</tspan><tspan x="70" dy="20">Middleware</tspan></text>
      <text x="70" y="174.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Route table, optional bearer</tspan><tspan x="70" dy="17">token, CORS, panic recovery,</tspan><tspan x="70" dy="17">graceful shutdown. One</tspan><tspan x="70" dy="17">process per td base</tspan><tspan x="70" dy="17">directory.</tspan></text>
      </g><g data-element="serve.handlers"><rect x="475.53" y="301" width="256" height="197" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(705.53 318) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="495.53" y="333" font-size="14" font-weight="600" fill="#292927"><tspan x="495.53" dy="0">Issue, Board &amp;</tspan><tspan x="495.53" dy="20">Transition Handlers</tspan></text>
      <text x="495.53" y="378" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="495.53" dy="0">Read, write, transition, review,</tspan><tspan x="495.53" dy="17">comment, dependency, board, focus,</tspan><tspan x="495.53" dy="17">stats and label handlers. Functions</tspan><tspan x="495.53" dy="17">over a request context so another</tspan><tspan x="495.53" dy="17">host can wrap them; list and</tspan><tspan x="495.53" dy="17">activity reads reuse the monitor</tspan><tspan x="495.53" dy="17">data assembly.</tspan></text>
      </g><g data-element="serve.sse"><rect x="475.53" y="530" width="212" height="176" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(661.53 547) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="495.53" y="562" font-size="14" font-weight="600" fill="#292927"><tspan x="495.53" dy="0">Change Stream</tspan></text>
      <text x="495.53" y="586" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="495.53" dy="0">GET /v1/events: broadcasts</tspan><tspan x="495.53" dy="17">a refresh to connected</tspan><tspan x="495.53" dy="17">clients after each write</tspan><tspan x="495.53" dy="17">(and on a polled change</tspan><tspan x="495.53" dy="17">token), then runs a</tspan><tspan x="495.53" dy="17">debounced autosync push</tspan><tspan x="495.53" dy="17">and pull of its own.</tspan></text>
      </g><g data-element="serve.portfile"><rect x="475.53" y="89" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(661.53 106) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="495.53" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="495.53" dy="0">Port File &amp; Web</tspan><tspan x="495.53" dy="20">Session</tspan></text>
      <text x="495.53" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="495.53" dy="0">Writes .todos/serve-port</tspan><tspan x="495.53" dy="17">with port, pid and instance</tspan><tspan x="495.53" dy="17">id for discovery;</tspan><tspan x="495.53" dy="17">bootstraps a dedicated web</tspan><tspan x="495.53" dy="17">session so writes are</tspan><tspan x="495.53" dy="17">attributed.</tspan></text>
      </g><g><rect x="319.14" y="405.5" width="99.24999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="368.765" y="418.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="368.765" dy="0">Route requests</tspan></text></g><g><rect x="319.14" y="624" width="99.24999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="368.765" y="637" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="368.765" dy="0">GET /v1/events</tspan></text></g><g><rect x="311" y="185" width="115.52999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="368.765" y="198" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="368.765" dy="0">Announce port and</tspan><tspan x="368.765" dy="15">web session</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#ddddda"/><text x="96" y="1044" font-size="13" fill="#7d7d77">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#7d7d77">FOCUS: td serve Local API · 15 external connections outside view</text></g></svg>
