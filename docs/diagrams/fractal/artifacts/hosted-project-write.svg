  <title id="sequence-title">A browser edit on a hosted project reaches the CLI</title><desc id="sequence-description">td-watch writes through the server&apos;s project API. The write lands in project.db using the same td serve handlers as a local project, is promoted into the event log, and is pulled by CLI clients like any other event.</desc><metadata>{&quot;journeyId&quot;:&quot;hosted-project-write&quot;,&quot;provenance&quot;:&quot;Authored 2026-09-11 from internal/api/project_routes.go (wrapServeHandler, projectMutateChain), internal/api/action_log_promotion.go, internal/api/broadcast.go and internal/serve/handlers_write.go. Not a captured trace.&quot;,&quot;hiddenLanes&quot;:[],&quot;rows&quot;:[{&quot;id&quot;:&quot;write&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;patch&quot;,&quot;authz&quot;,&quot;acquire&quot;,&quot;handler&quot;,&quot;logged_write&quot;,&quot;handler_done&quot;,&quot;resp&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;browser&quot;,&quot;middleware&quot;,&quot;project_api&quot;,&quot;project_db&quot;,&quot;handlers&quot;]},{&quot;id&quot;:&quot;patch&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;patch&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;browser&quot;,&quot;middleware&quot;]},{&quot;id&quot;:&quot;authz&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;authz&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;middleware&quot;,&quot;project_api&quot;]},{&quot;id&quot;:&quot;acquire&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;acquire&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;project_db&quot;]},{&quot;id&quot;:&quot;handler&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;handler&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;handlers&quot;]},{&quot;id&quot;:&quot;logged_write&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;logged_write&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;handlers&quot;,&quot;project_db&quot;]},{&quot;id&quot;:&quot;handler_done&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;handler_done&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;handlers&quot;,&quot;project_api&quot;]},{&quot;id&quot;:&quot;resp&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;resp&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;browser&quot;]},{&quot;id&quot;:&quot;promote&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;promote_call&quot;,&quot;attach&quot;,&quot;notify&quot;,&quot;sse_out&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;promotion&quot;,&quot;events_db&quot;,&quot;sse&quot;,&quot;browser&quot;]},{&quot;id&quot;:&quot;promote_call&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;promote_call&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;promotion&quot;]},{&quot;id&quot;:&quot;attach&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;attach&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;promotion&quot;,&quot;events_db&quot;]},{&quot;id&quot;:&quot;notify&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;notify&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;project_api&quot;,&quot;sse&quot;]},{&quot;id&quot;:&quot;sse_out&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;sse_out&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;sse&quot;,&quot;browser&quot;]},{&quot;id&quot;:&quot;converge&quot;,&quot;type&quot;:&quot;